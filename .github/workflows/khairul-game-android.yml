name: Build KHAIRUL GAME Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'khairul-game/**'
      - '.github/workflows/khairul-game-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: khairul-game
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khairul-game-debug-apk
          path: khairul-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
